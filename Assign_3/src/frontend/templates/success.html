<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registration Successful</title>
    <style>
	:root {
		color-scheme: dark;
		font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
			"Segoe UI", sans-serif;
		background: #090b12;
		color: #f4f5fb;
	}

	* {
		box-sizing: border-box;
	}

	body {
		min-height: 100vh;
		margin: 0;
		display: grid;
		place-items: center;
		padding: 24px;
		overflow: hidden;
		background:
			radial-gradient(ellipse at 15% 20%, rgb(99 72 190 / 20%), transparent 35%),
			radial-gradient(ellipse at 85% 80%, rgb(0 181 173 / 15%), transparent 35%),
			#090b12;
	}

	body::before,
	body::after {
		content: "";
		position: fixed;
		width: 280px;
		height: 280px;
		border-radius: 50%;
		opacity: 0.3;
		z-index: -1;
		animation: drift 12s ease-in-out infinite alternate;
	}

	body::before {
		top: 8%;
		left: 8%;
		background: radial-gradient(circle, #8b5cf6, transparent 68%);
	}

	body::after {
		right: 8%;
		bottom: 5%;
		background: radial-gradient(circle, #14b8a6, transparent 68%);
		animation-delay: -5s;
	}

	main {
		width: min(100%, 500px);
		padding: clamp(32px, 7vw, 52px);
		border: 1px solid rgb(255 255 255 / 12%);
		border-radius: 24px;
		background: rgb(20 23 34 / 82%);
		box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
		backdrop-filter: blur(18px);
		text-align: center;
		animation: appear 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
	}

	.success-icon {
		display: grid;
		width: 68px;
		height: 68px;
		margin: 0 auto 22px;
		place-items: center;
		border: 1px solid rgb(45 212 191 / 30%);
		border-radius: 50%;
		background: rgb(20 184 166 / 12%);
		color: #5eead4;
		font-size: 2rem;
		animation: pop 500ms 200ms both;
	}

	h1 {
		margin: 0 0 12px;
		font-size: clamp(1.8rem, 6vw, 2.5rem);
		letter-spacing: -0.06em;
	}

	p {
		margin: 0;
		color: #a6aabd;
		font-size: 1rem;
		line-height: 1.7;
	}

	@keyframes appear {
		from {
			opacity: 0;
			transform: translateY(18px) scale(0.98);
		}
		to {
			opacity: 1;
			transform: translateY(0) scale(1);
		}
	}

	@keyframes pop {
		from {
			opacity: 0;
			transform: scale(0.6);
		}
		to {
			opacity: 1;
			transform: scale(1);
		}
	}

	@keyframes drift {
		from {
			transform: translate3d(0, 0, 0) scale(0.9);
		}
		to {
			transform: translate3d(28px, -22px, 0) scale(1.12);
		}
	}

	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after {
			animation-duration: 0.01ms !important;
			animation-iteration-count: 1 !important;
			transition-duration: 0.01ms !important;
		}
	}
</style>
</head>
<body>
	<main>
	<div class="success-icon" aria-hidden="true">✓</div>
	<h1>Registration Successful!</h1>
	<p>Hey {{name}}! Data submitted successfully! Your registration is complete!</p>
</main>
</body>
</html>
